<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>华晶玻璃制品有限公司 - 首页</title>
    <style>
        /* 全局样式 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; color: #333; line-height: 1.6; }
        a { text-decoration: none; color: inherit; }
        
        /* 导航栏 */
        header { background: rgba(255, 255, 255, 0.95); box-shadow: 0 2px 5px rgba(0,0,0,0.1); position: sticky; top: 0; z-index: 100; }
        .nav-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 20px; }
        .logo { font-size: 24px; font-weight: bold; color: #0066cc; }
        nav a { margin-left: 20px; font-weight: 500; }
        nav a:hover, nav a.active { color: #0066cc; }

        /* 横幅广告 (Hero Section) */
        .hero { background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('https://images.unsplash.com/photo-1517646287270-a5a9ca602e5c?auto=format&fit=crop&w=1920&q=80') no-repeat center center/cover; height: 450px; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; text-align: center; padding: 0 20px; }
        .hero h1 { font-size: 48px; margin-bottom: 15px; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        .hero p { font-size: 20px; max-width: 600px; }

        /* 特色板块 */
        .features { max-width: 1200px; margin: 60px auto; padding: 0 20px; text-align: center; }
        .features h2 { font-size: 32px; margin-bottom: 40px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; }
        .card { padding: 30px; border: 1px solid #eee; border-radius: 8px; transition: 0.3s; background: #fff; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .card h3 { margin-bottom: 15px; color: #0066cc; }

        /* 页脚 */
        footer { background: #222; color: #fff; text-align: center; padding: 30px 20px; margin-top: 60px; font-size: 14px; }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <div class="logo">💎 华晶玻璃</div>
            <nav>
                <a href="index.html" class="active">首页</a>
                <a href="products.html">产品中心</a>
                <a href="contact.html">联系我们</a>
            </nav>
        </div>
    </header>

    <section class="hero">
        <h1>透光艺术，坚固守护</h1>
        <p>专注于高品质建筑玻璃、装饰玻璃与定制化玻璃解决方案，用科技点亮空间。</p>
    </section>

    <section class="features">
        <h2>为什么选择我们？</h2>
        <div class="grid">
            <div class="card">
                <h3>卓越品质</h3>
                <p>采用国际领先的生产工艺，通过ISO9001质量认证，抗冲击力强，安全可靠。</p>
            </div>
            <div class="card">
                <h3>厂家直销</h3>
                <p>自设大型现代化生产工厂，省去中间商差价，给您最具竞争力的价格。</p>
            </div>
            <div class="card">
                <h3>高端定制</h3>
                <p>根据您的建筑或设计需求，提供尺寸、厚度、工艺的专属全套定制服务。</p>
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 华晶玻璃制品有限公司 版权所有 | 沪ICP备12345678号</p>
    </footer>

</body>
</html>
